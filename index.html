<!DOCTYPE html>
<html lang="en" class="bg-app">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeamNG Car Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rubik+Wet+Paint&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="custom-titlebar">
    <div class="titlebar-label">x0</div>
    <div class="titlebar-controls">
      <button onclick="window.chrome.webview.postMessage({action:'minimize'})">&minus;</button>
      <button onclick="window.chrome.webview.postMessage({action:'toggle_maximize'})">&#9723;</button>
      <button onclick="window.chrome.webview.postMessage({action:'close'})">&times;</button>
    </div>
  </div>
  
  <!-- ============ SPLASH SCREEN ============ -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-logo">
      <svg class="crown-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
      </svg>
      <h1 class="splash-title">x0</h1>
    </div>
    <p class="splash-sub">WELCOME BACK</p>
    <p class="splash-credit">This App Has Been Developed by Ray</p>
  </div>

  <!-- ============ VERIFY SCREEN ============ -->
  <section id="verify-screen" class="verify-screen">
    <div class="verify-glow" aria-hidden="true"></div>
    <div class="verify-card">
      <div class="verify-logo">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 16.5V14a2 2 0 0 0-2-2H6.2a2 2 0 0 0-1.9 1.4L3 17" />
          <path d="M19 17h2v-3.3a2 2 0 0 0-.6-1.4l-2.3-2.3A2 2 0 0 0 16.7 9H14" />
          <circle cx="7" cy="17" r="2" />
          <circle cx="17" cy="17" r="2" />
        </svg>
      </div>
      <h1 class="verify-title">BeamNG Car Hub</h1>
      <p class="verify-sub">Please verify to access the vehicle library.</p>

      <button id="verify-btn" class="btn-verify" type="button">
        <span class="btn-verify-label">Verify</span>
        <span class="btn-verify-spinner" aria-hidden="true"></span>
      </button>

      <p id="verify-status" class="verify-status" role="status" aria-live="polite"></p>
    </div>
    <p class="verify-footer">v1.0.0 &middot; Unofficial mod client</p>
  </section>

  <!-- ============ GALLERY SCREEN ============ -->
  <main id="gallery-screen" class="gallery-screen" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 16.5V14a2 2 0 0 0-2-2H6.2a2 2 0 0 0-1.9 1.4L3 17" />
            <path d="M19 17h2v-3.3a2 2 0 0 0-.6-1.4l-2.3-2.3A2 2 0 0 0 16.7 9H14" />
            <circle cx="7" cy="17" r="2" />
            <circle cx="17" cy="17" r="2" />
          </svg>
        </div>
        <div>
          <h1 id="gallery-title" class="topbar-title">Car Library</h1>
          <p id="gallery-count-label" class="topbar-count"><span id="result-count">0</span> vehicles available</p>
        </div>
        <div class="mode-switcher-container">
          <button id="btn-mode-cars" class="mode-btn active" type="button">🏎️ Cars</button>
          <button id="btn-mode-maps" class="mode-btn" type="button">🗺️ Maps</button>
          <div class="mode-slider"></div>
        </div>
        <button id="btn-discord-server" class="btn-discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
          </svg>
          Discord
        </button>
      </div>

      <div class="topbar-right">
        <div id="discord-profile-container"></div>
        <div class="topbar-search">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input id="search-input" class="search-input" type="text" placeholder="Search cars..." autocomplete="off" aria-label="Search cars" />
        </div>
        <div class="topbar-actions">
          <button id="btn-open-folder" class="btn-action" title="Open Game Folder">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button id="btn-refresh-cars" class="btn-action" title="Refresh Cars">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 2.6-6.4L2 9"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 1 0-2.6 6.4L22 15"/></svg>
          </button>
        </div>
      </div>
    </header>

    <nav class="tag-bar" id="tag-bar" aria-label="Filter by category"></nav>

    <section class="car-grid" id="car-grid" aria-live="polite"></section>

    <div id="pagination" class="pagination"></div>

    <div class="empty-state" id="empty-state" hidden>
      <p>No cars match your search.</p>
    </div>
  </main>

  <script src="./cars.js"></script>
  <script src="./app.js"></script>
</body>
</html>
