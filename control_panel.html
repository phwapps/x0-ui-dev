<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Control Panel - x0</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --app: #000000;
      --surface: #0f0f0f;
      --surface-2: #1a1a1a;
      --border: #262626;
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #ffffff;
      --ok: #22c55e;
      --error: #ef4444;
      --radius: 12px;
    }
    body { background-color: var(--app); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-y: hidden; display: flex; flex-direction: column; height: 100vh; }
    
    .custom-titlebar { display: flex; justify-content: space-between; align-items: center; height: 32px; background: #000; border-bottom: 1px solid var(--border); user-select: none; flex-shrink: 0; }
    .titlebar-label { padding-left: 14px; font-size: 12px; font-weight: 600; color: #888; letter-spacing: 1px; }
    .titlebar-controls { display: flex; height: 100%; }
    .titlebar-controls button { background: transparent; border: none; color: #888; width: 45px; height: 100%; font-size: 16px; cursor: pointer; transition: all 0.2s; }
    .titlebar-controls button:hover { background: #222; color: #fff; }
    .titlebar-controls button:last-child:hover { background: #e81123; }

    .header { padding: 20px 30px 0; }
    .header h1 { font-size: 24px; font-weight: 700; margin: 0 0 16px 0; }
    
    .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab { padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }




    .content { flex: 1; overflow-y: auto; padding: 0 30px 30px; }
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; box-sizing: border-box; transition: border-color 0.2s; }
    .form-group input:focus { outline: none; border-color: var(--muted); }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 12px; font-size: 14px; font-weight: 600; color: #000; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; transition: transform 0.1s, background 0.2s; }
    .btn:hover { background: #e5e5e5; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.7; cursor: default; transform: none; }
    
    .status-msg { margin-top: 14px; text-align: center; font-size: 13px; font-weight: 600; min-height: 20px; }
    .status-msg.ok { color: var(--ok); }
    .status-msg.error { color: var(--error); }

    /* List View */
    .dropzone { width: 100%; padding: 20px; border: 2px dashed var(--border); border-radius: 8px; text-align: center; color: var(--muted); cursor: pointer; transition: 0.2s; background: var(--surface); box-sizing: border-box; }
    .dropzone:hover, .dropzone.dragover { border-color: var(--accent); color: var(--text); background: var(--surface-2); }
    
    .car-list { display: flex; flex-direction: column; gap: 12px; }
    .car-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
    .car-info { display: flex; align-items: center; gap: 14px; }
    .car-img-thumb { width: 48px; height: 32px; border-radius: 4px; object-fit: cover; background: #000; }
    .car-details h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .car-details p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    
    .btn-icon { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 8px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
    .btn-icon:hover { background: #2a2a2a; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; place-items: center; z-index: 100; }
    .modal-overlay.active { display: grid; }
    .modal-card { background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .modal-card h2 { margin: 0 0 20px; font-size: 20px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--surface-2); }
    
    /* Bulk Upload View */
    .bulk-row { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; position: relative; }
    .bulk-row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .bulk-row-header h4 { margin: 0; font-size: 14px; }
    .bulk-row-header .btn-remove { background: transparent; color: var(--error); border: none; cursor: pointer; font-size: 13px; font-weight: 600; padding: 0; }
    .bulk-row-header .btn-remove:hover { text-decoration: underline; }
    .bulk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .bulk-grid .form-group { margin-bottom: 0; }
    .bulk-grid.full { grid-template-columns: 1fr; margin-top: 12px; }
    .upload-input-group { display: flex; gap: 8px; }
    .upload-input-group input { flex: 1; min-width: 0; }
    .btn-upload-small { padding: 0 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .btn-upload-small:hover { background: #2a2a2a; }
  </style>
</head>
<body>
  <!-- ADMIN LOCK SCREEN OVERLAY -->
  <div id="adminLockOverlay" style="position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #0f0f0f; border: 1px solid #262626; padding: 32px; border-radius: 16px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.9);">
      <div style="font-size: 40px; margin-bottom: 12px;">🔒</div>
      <h2 style="margin: 0 0 8px; font-size: 20px; font-weight: 700; color: #fff;">Admin Access Required</h2>
      <p style="margin: 0 0 20px; font-size: 13px; color: #a1a1aa;">Enter the security password to access x0 Control Panel.</p>
      <input type="password" id="adminPassInput" placeholder="Password" style="width: 100%; padding: 12px 14px; background: #1a1a1a; border: 1px solid #262626; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; margin-bottom: 12px; text-align: center;" />
      <button id="adminLoginBtn" style="width: 100%; padding: 12px; font-size: 14px; font-weight: 600; color: #000; background: #fff; border: none; border-radius: 8px; cursor: pointer;">Unlock Control Panel</button>
      <div id="adminLockErr" style="margin-top: 12px; font-size: 13px; color: #ef4444; font-weight: 600; min-height: 18px;"></div>
    </div>
  </div>

  <div class="custom-titlebar">
    <div class="titlebar-label">Control Panel - x0</div>
    <div class="titlebar-controls">
      <button onclick="window.chrome.webview.postMessage({action:'minimize'})">&minus;</button>
      <button onclick="window.chrome.webview.postMessage({action:'toggle_maximize'})">&#9723;</button>
      <button onclick="window.chrome.webview.postMessage({action:'close'})">&times;</button>
    </div>
  </div>

  <div class="header">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1>👑 Control Panel</h1>
    </div>
    
    <div style="display: flex; gap: 12px; margin: 16px 0 20px;">
      <div style="flex:1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center;">
        <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 600;">Total Users</div>
        <div id="stat-total" style="font-size: 26px; font-weight: 800; color: var(--accent);">0</div>
      </div>
      <div style="flex:1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center;">
        <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 600;">Online Now</div>
        <div id="stat-online" style="font-size: 26px; font-weight: 800; color: #4ade80;">0</div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="add">Add Item</div>
      <div class="tab" data-tab="bulk">Bulk Upload</div>
      <div class="tab" data-tab="manage-cars">Manage Cars</div>
      <div class="tab" data-tab="manage-maps">Manage Maps</div>
    </div>

  </div>

  <div class="content">
    <!-- ADD CAR VIEW -->
    <div id="view-add" class="view-section active">
      <div class="form-group">
        <label>Item Type</label>
        <select id="itemType" style="width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; transition: border-color 0.2s; box-sizing: border-box;">
          <option value="car">🚗 Car (سيارة)</option>
          <option value="map">🗺️ Map (ماب)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="carName" placeholder="e.g. Skyline R34">
      </div>
      <div class="form-group">
        <label id="lblTag">Brand / Tag</label>
        <input type="text" id="carTag" placeholder="e.g. Nissan">
      </div>
      <div class="form-group">
        <label>Image (Upload or Paste URL)</label>
        <div id="imageDropzone" class="dropzone" onclick="document.getElementById('imageFileInput').click()">
            <p style="margin:0; font-size:13px; font-weight:600;">☁️ Drag & Drop Photo Here or Click</p>
            <input type="file" id="imageFileInput" accept="image/*" class="hidden" style="display:none;">
            <div id="imageUploadStatus" style="font-size: 12px; margin-top: 8px; font-weight: bold;"></div>
        </div>
        <input type="text" id="carImage" placeholder="https://.../image.png" style="margin-top: 10px;">
      </div>
      <div class="form-group">
        <label>File Size</label>
        <input type="text" id="carSize" placeholder="e.g. 150 MB">
      </div>
      <div class="form-group">
        <label>Download Link (.zip)</label>
        <input type="text" id="carFile" placeholder="https://.../car.zip">
      </div>
      <button id="uploadBtn" class="btn">Upload Item</button>
      <div id="uploadStatus" class="status-msg"></div>
    </div>

    <!-- BULK UPLOAD VIEW -->
    <div id="view-bulk" class="view-section">
      <div id="bulkFormsContainer"></div>
      <button id="addBulkFormBtn" class="btn btn-outline" style="border-style: dashed; margin-bottom: 20px; color: var(--muted);">+ Add Another Item</button>
      <button id="uploadBulkBtn" class="btn">Upload All Items</button>
      <div id="bulkUploadStatus" class="status-msg"></div>
    </div>

    <!-- MANAGE CARS VIEW -->
    <div id="view-manage-cars" class="view-section">
      <div id="carList" class="car-list">
        <div class="status-msg" style="margin-top: 40px; color: var(--muted);">Loading cars...</div>
      </div>
    </div>

    <!-- MANAGE MAPS VIEW -->
    <div id="view-manage-maps" class="view-section">
      <div id="mapList" class="car-list">
        <div class="status-msg" style="margin-top: 40px; color: var(--muted);">Loading maps...</div>
      </div>
    </div>
  </div>



  <!-- EDIT MODAL -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-card">
      <h2>Edit Car</h2>
      <input type="hidden" id="editKey">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Car Name</label>
        <input type="text" id="editName">
      </div>
      <div class="form-group">
        <label>Brand / Tag</label>
        <input type="text" id="editTag">
      </div>
      <div class="form-group">
        <label>Image Link</label>
        <input type="text" id="editImage">
      </div>
      <div class="form-group">
        <label>File Size</label>
        <input type="text" id="editSize">
      </div>
      <div class="form-group">
        <label>Download Link</label>
        <input type="text" id="editFile">
      </div>
      <div class="modal-actions">
        <button id="cancelEditBtn" class="btn btn-outline">Cancel</button>
        <button id="deleteEditBtn" class="btn btn-outline" style="color: var(--error); border-color: var(--error);">Delete</button>
        <button id="saveEditBtn" class="btn">Save Changes</button>
      </div>
      <div id="editStatus" class="status-msg"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, push, get, update, remove } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://raysystemcars-default-rtdb.firebaseio.com/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Admin Lock Password Check
    const ADMIN_SECRET = "Mskon009988";
    const lockOverlay = document.getElementById("adminLockOverlay");
    const lockPassInput = document.getElementById("adminPassInput");
    const lockLoginBtn = document.getElementById("adminLoginBtn");
    const lockErr = document.getElementById("adminLockErr");

    function tryUnlock() {
      if (lockPassInput.value === ADMIN_SECRET) {
        lockOverlay.style.display = "none";
        sessionStorage.setItem("x0_admin_unlocked", "true");
      } else {
        lockErr.innerText = "❌ Incorrect Admin Password!";
        lockPassInput.value = "";
      }
    }

    if (sessionStorage.getItem("x0_admin_unlocked") === "true") {
      lockOverlay.style.display = "none";
    }

    lockLoginBtn.addEventListener("click", tryUnlock);
    lockPassInput.addEventListener("keyup", (e) => { if (e.key === "Enter") tryUnlock(); });

    // Telemetry logic
    function updateTelemetry() {
      get(ref(db, 'telemetry')).then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          
          let totalUsers = 0;
          if (data.users) totalUsers = Object.keys(data.users).length;
          document.getElementById('stat-total').innerText = totalUsers;
          
          let onlineNow = 0;
          if (data.active) {
            const now = Date.now();
            for (let userId in data.active) {
              const lastPing = data.active[userId];
              // User is online if they pinged within the last 60 seconds
              if (now - lastPing < 60000) {
                onlineNow++;
              }
            }
          }
          document.getElementById('stat-online').innerText = onlineNow;
        }
      }).catch(e => console.error("Telemetry error", e));
    }
    updateTelemetry();
    setInterval(updateTelemetry, 10000); // Refresh every 10 seconds

    // Titlebar drag logic
    const titlebar = document.querySelector('.custom-titlebar');
    if (titlebar) {
      titlebar.addEventListener('mousedown', function(e) {
        if (e.target.closest('button')) return;
        window.chrome.webview.postMessage({action:'drag_window'});
      });
    }

    // Item Type dynamic label logic
    const itemTypeSelect = document.getElementById("itemType");
    const lblTag = document.getElementById("lblTag");
    const carTagInput = document.getElementById("carTag");
    if (itemTypeSelect && lblTag && carTagInput) {
      itemTypeSelect.addEventListener("change", (e) => {
        if (e.target.value === "map") {
          lblTag.innerText = "Map Category";
          carTagInput.placeholder = "e.g. City, Drift, Offroad";
        } else {
          lblTag.innerText = "Brand / Tag";
          carTagInput.placeholder = "e.g. Nissan, Toyota";
        }
      });
    }

    // Tab Logic
    const tabs = document.querySelectorAll('.tab');
    const views = document.querySelectorAll('.view-section');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        views.forEach(v => v.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`view-${tab.dataset.tab}`).classList.add('active');
        if (tab.dataset.tab === 'manage-cars' || tab.dataset.tab === 'manage-maps') {
          loadItems(tab.dataset.tab);
        }
      });
    });



    // Image Upload Logic
    const imageDropzone = document.getElementById('imageDropzone');
    const imageFileInput = document.getElementById('imageFileInput');
    const carImageInput = document.getElementById('carImage');
    const imageUploadStatus = document.getElementById('imageUploadStatus');

    imageDropzone.addEventListener('dragover', (e) => { e.preventDefault(); imageDropzone.classList.add('dragover'); });
    imageDropzone.addEventListener('dragleave', (e) => { e.preventDefault(); imageDropzone.classList.remove('dragover'); });
    imageDropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        imageDropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) uploadToImgur(e.dataTransfer.files[0], carImageInput, imageUploadStatus);
    });
    imageFileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) uploadToImgur(e.target.files[0], carImageInput, imageUploadStatus);
        imageFileInput.value = '';
    });

    async function uploadToImgur(file, targetInput, targetStatus) {
        if (!file.type.startsWith('image/')) return;
        targetStatus.innerText = "Uploading to Cloud...";
        targetStatus.style.color = "var(--accent)";
        const formData = new FormData();
        formData.append("image", file);
        try {
            const res = await fetch("https://api.imgur.com/3/image", {
                method: "POST",
                headers: { "Authorization": "Client-ID 546c25a59c58ad7" },
                body: formData
            });
            const json = await res.json();
            if (json.success) {
                targetInput.value = json.data.link;
                targetStatus.innerText = "✅ Uploaded successfully!";
                targetStatus.style.color = "var(--ok)";
            } else {
                targetStatus.innerText = "❌ Upload failed: " + (json.data.error || "Unknown error");
                targetStatus.style.color = "var(--error)";
            }
        } catch(e) {
            targetStatus.innerText = "❌ Upload error: " + e.message;
            targetStatus.style.color = "var(--error)";
        }
    }

    function isMapItem(c) {
      if (!c) return false;
      var tag = (c.tag || "").toLowerCase();
      return tag === "maps" || tag.indexOf("map:") === 0 || tag === "map" || tag === "الخرائط" || tag === "🗺️ خرائط السيرفر";
    }

    // Upload Logic
    document.getElementById("uploadBtn").addEventListener("click", async () => {
      const type = document.getElementById("itemType").value;
      const name = document.getElementById("carName").value.trim();
      const tag = document.getElementById("carTag").value.trim();
      const image = document.getElementById("carImage").value.trim();
      const size = document.getElementById("carSize").value.trim();
      const file = document.getElementById("carFile").value.trim();
      const status = document.getElementById("uploadStatus");
      const btn = document.getElementById("uploadBtn");

      if (!name || !file) {
        status.className = "status-msg error";
        status.innerText = "Error: Name and Download Link are required.";
        return;
      }

      let finalTag = tag;
      if (type === "map") {
        if (tag.toLowerCase() !== "maps" && tag.toLowerCase().indexOf("map:") !== 0) {
          finalTag = "Map: " + (tag || "General");
        }
      }

      btn.disabled = true;
      btn.innerText = "Uploading...";
      status.className = "status-msg";
      status.style.color = "var(--muted)";
      status.innerText = "Uploading to Database...";

      try {
        const carsRef = ref(db, type === 'car' ? '/v2_cars' : '/v2_cars_dev');
        await push(carsRef, {
          id: "x0_car_" + Date.now(),
          name: name,
          tag: finalTag,
          brand: finalTag,
          image: image,
          size: size,
          file: file,
          meta: finalTag
        });
        status.className = "status-msg ok";
        status.innerText = "✅ Success! Item added.";
        setTimeout(() => {
          document.querySelectorAll("#view-add input").forEach(i => i.value = "");
          status.innerText = "";
          btn.disabled = false;
          btn.innerText = "Upload Item";
        }, 1500);
      } catch (error) {
        status.className = "status-msg error";
        status.innerText = "Upload failed: " + error.message;
        btn.disabled = false;
        btn.innerText = "Upload Item";
      }
    });

    // Manage Logic
    let currentCars = {};

    async function loadItems(tabName) {
      const carListEl = document.getElementById("carList");
      const mapListEl = document.getElementById("mapList");
      
      if (tabName === 'manage-cars') {
        carListEl.innerHTML = '<div class="status-msg" style="color: var(--muted); margin-top: 40px;">Fetching from database...</div>';
      } else {
        mapListEl.innerHTML = '<div class="status-msg" style="color: var(--muted); margin-top: 40px;">Fetching from database...</div>';
      }

      try {
        const carsRef = ref(db, tabName === 'manage-cars' ? '/v2_cars' : '/v2_cars_dev');
        const snapshot = await get(carsRef);
        if (snapshot.exists()) {
          currentCars = snapshot.val();
          if (tabName === 'manage-cars') {
            renderCars();
          } else {
            renderMaps();
          }
        } else {
          currentCars = {};
          if (tabName === 'manage-cars') {
            carListEl.innerHTML = '<div class="status-msg" style="color: var(--muted); margin-top: 40px;">No cars found.</div>';
          } else {
            mapListEl.innerHTML = '<div class="status-msg" style="color: var(--muted); margin-top: 40px;">No maps found.</div>';
          }
        }
      } catch (e) {
        if (tabName === 'manage-cars') {
          carListEl.innerHTML = `<div class="status-msg error">Error loading items: ${e.message}</div>`;
        } else {
          mapListEl.innerHTML = `<div class="status-msg error">Error loading items: ${e.message}</div>`;
        }
      }
    }

    function renderCars() {
      const carListEl = document.getElementById("carList");
      carListEl.innerHTML = "";
      const keys = Object.keys(currentCars).reverse();
      let count = 0;
      keys.forEach(key => {
        const car = currentCars[key];
        if (isMapItem(car)) return;
        count++;
        const el = document.createElement('div');
        el.className = 'car-item';
        el.innerHTML = `
          <div class="car-info">
            <img src="${escapeHtml(car.image || '')}" class="car-img-thumb" onerror="this.style.display='none'">
            <div class="car-details">
              <h3>${escapeHtml(car.name)}</h3>
              <p>${escapeHtml(car.tag || 'No Tag')} • ${escapeHtml(car.size || 'Unknown Size')}</p>
            </div>
          </div>
          <button class="btn-icon" data-key="${key}" title="Edit Car">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        `;
        el.querySelector('.btn-icon').addEventListener('click', () => window.openEditModal(key));
        carListEl.appendChild(el);
      });
      if (count === 0) {
        carListEl.innerHTML = '<div class="status-msg" style="color: var(--muted); margin-top: 40px;">No cars found.</div>';
      }
    }

    function renderMaps() {
      const mapListEl = document.getElementById("mapList");
      mapListEl.innerHTML = "";
      const keys = Object.keys(currentCars).reverse();
      let count = 0;
      keys.forEach(key => {
        const car = currentCars[key];
        if (!isMapItem(car)) return;
        count++;
        const el = document.createElement('div');
        el.className = 'car-item';
        el.innerHTML = `
          <div class="car-info">
            <img src="${escapeHtml(car.image || '')}" class="car-img-thumb" onerror="this.style.display='none'">
            <div class="car-details">
              <h3>${escapeHtml(car.name)}</h3>
              <p>${escapeHtml(car.tag || 'No Tag')} • ${escapeHtml(car.size || 'Unknown Size')}</p>
            </div>
          </div>
          <button class="btn-icon" data-key="${key}" title="Edit Map">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        `;
        el.querySelector('.btn-icon').addEventListener('click', () => window.openEditModal(key));
        mapListEl.appendChild(el);
      });
      if (count === 0) {
        mapListEl.innerHTML = '<div class="status-msg" style="color: var(--muted); margin-top: 40px;">No maps found.</div>';
      }
    }

    function escapeHtml(str) {
      if(!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // Edit Modal Logic
    const modal = document.getElementById("editModal");
    window.openEditModal = function(key) {
      const activeTab = document.querySelector(".tab.active").dataset.tab;
      window.currentEditDbNode = (activeTab === 'manage-cars') ? '/v2_cars' : '/v2_cars_dev';

      const car = currentCars[key];
      document.getElementById("editKey").value = key;
      document.getElementById("editId").value = car.id || "";
      document.getElementById("editName").value = car.name || "";
      document.getElementById("editTag").value = car.tag || "";
      document.getElementById("editImage").value = car.image || "";
      document.getElementById("editSize").value = car.size || "";
      document.getElementById("editFile").value = car.file || "";
      document.getElementById("editStatus").innerText = "";
      modal.classList.add("active");
    }

    document.getElementById("cancelEditBtn").addEventListener("click", () => {
      modal.classList.remove("active");
    });

    document.getElementById("saveEditBtn").addEventListener("click", async () => {
      const key = document.getElementById("editKey").value;
      const btn = document.getElementById("saveEditBtn");
      const status = document.getElementById("editStatus");
      
      btn.disabled = true;
      btn.innerText = "Saving...";
      status.className = "status-msg";
      status.style.color = "var(--muted)";
      status.innerText = "Updating database...";

      const updatedData = {
        id: document.getElementById("editId").value,
        name: document.getElementById("editName").value.trim(),
        tag: document.getElementById("editTag").value.trim(),
        brand: document.getElementById("editTag").value.trim(),
        image: document.getElementById("editImage").value.trim(),
        size: document.getElementById("editSize").value.trim(),
        file: document.getElementById("editFile").value.trim(),
        meta: document.getElementById("editTag").value.trim()
      };

      try {
        await update(ref(db, `${window.currentEditDbNode}/${key}`), updatedData);
        status.className = "status-msg ok";
        status.innerText = "✅ Saved!";
        // Update local state so list reflects it
        currentCars[key] = updatedData;
        setTimeout(() => {
          modal.classList.remove("active");
          btn.disabled = false;
          btn.innerText = "Save Changes";
          
          // Re-render based on active tab
          const activeTab = document.querySelector(".tab.active").dataset.tab;
          loadItems(activeTab);
        }, 1000);
      } catch (error) {
        status.className = "status-msg error";
        status.innerText = "Save failed: " + error.message;
        btn.disabled = false;
        btn.innerText = "Save Changes";
      }
    });

    // Delete Logic
    document.getElementById("deleteEditBtn").addEventListener("click", async () => {
      if (!confirm("Are you sure you want to permanently delete this item? This cannot be undone.")) return;
      const key = document.getElementById("editKey").value;
      const btn = document.getElementById("deleteEditBtn");
      const status = document.getElementById("editStatus");
      
      btn.disabled = true;
      status.className = "status-msg";
      status.style.color = "var(--error)";
      status.innerText = "Deleting from database...";

      try {
        await remove(ref(db, `${window.currentEditDbNode}/${key}`));
        status.className = "status-msg ok";
        status.innerText = "✅ Deleted!";
        delete currentCars[key];
        setTimeout(() => {
          modal.classList.remove("active");
          btn.disabled = false;
          
          // Re-render based on active tab
          const activeTab = document.querySelector(".tab.active").dataset.tab;
          loadItems(activeTab);
        }, 1000);
      } catch (error) {
        status.className = "status-msg error";
        status.innerText = "Delete failed: " + error.message;
        btn.disabled = false;
      }
    });

    // Bulk Upload Logic
    const bulkContainer = document.getElementById("bulkFormsContainer");
    let bulkFormCounter = 0;

    function addBulkCarForm() {
      bulkFormCounter++;
      const rowId = 'bulkRow_' + bulkFormCounter;
      const div = document.createElement("div");
      div.className = "bulk-row";
      div.id = rowId;
      div.innerHTML = `
        <div class="bulk-row-header">
          <h4>Item #${bulkFormCounter}</h4>
          ${bulkFormCounter > 1 ? `<button type="button" class="btn-remove" onclick="document.getElementById('${rowId}').remove()">Remove</button>` : ''}
        </div>
        <div class="bulk-grid">
          <div class="form-group">
            <label>Type</label>
            <select class="b-type" style="width:100%; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; font-family:inherit; box-sizing:border-box;">
              <option value="car">🚗 Car</option>
              <option value="map">🗺️ Map</option>
            </select>
          </div>
          <div class="form-group">
            <label>Name</label>
            <input type="text" class="b-name" placeholder="Name">
          </div>
          <div class="form-group">
            <label>Brand / Tag / Category</label>
            <input type="text" class="b-tag" placeholder="Tag">
          </div>
          <div class="form-group">
            <label>File Size</label>
            <input type="text" class="b-size" placeholder="Size">
          </div>
        </div>
        <div class="bulk-grid full" style="margin-top: 12px;">
          <div class="form-group">
            <label>Download Link (.zip)</label>
            <input type="text" class="b-file" placeholder="Link">
          </div>
        </div>
        <div class="bulk-grid full">
          <div class="form-group">
            <label>Image Link</label>
            <div class="upload-input-group">
              <input type="text" class="b-image" placeholder="Image Link">
              <button class="btn-upload-small" type="button" onclick="document.getElementById('file_${rowId}').click()">Upload Photo</button>
            </div>
            <input type="file" id="file_${rowId}" accept="image/*" style="display:none;">
            <div class="status-msg" style="text-align:left; min-height:auto; font-size:12px; margin-top:4px;" id="status_${rowId}"></div>
          </div>
        </div>
      `;
      bulkContainer.appendChild(div);

      // Bind local file input
      const fileInput = div.querySelector(`#file_${rowId}`);
      const imgInput = div.querySelector(`.b-image`);
      const statusDiv = div.querySelector(`#status_${rowId}`);
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          uploadToImgur(e.target.files[0], imgInput, statusDiv);
        }
        fileInput.value = '';
      });
    }

    // Initialize first row
    addBulkCarForm();
    document.getElementById("addBulkFormBtn").addEventListener("click", addBulkCarForm);

    document.getElementById("uploadBulkBtn").addEventListener("click", async () => {
      const rows = document.querySelectorAll(".bulk-row");
      const status = document.getElementById("bulkUploadStatus");
      const btn = document.getElementById("uploadBulkBtn");
      
      let itemsToUpload = [];
      for(let i = 0; i < rows.length; i++) {
        const r = rows[i];
        const type = r.querySelector(".b-type").value;
        const name = r.querySelector(".b-name").value.trim();
        const tag = r.querySelector(".b-tag").value.trim();
        const size = r.querySelector(".b-size").value.trim();
        const file = r.querySelector(".b-file").value.trim();
        const image = r.querySelector(".b-image").value.trim();
        
        if(!name || !file) {
          status.className = "status-msg error";
          status.innerText = `Error: Item at position ${i+1} is missing a Name or Download Link.`;
          return;
        }
        
        let finalTag = tag;
        if (type === "map") {
          if (tag.toLowerCase() !== "maps" && tag.toLowerCase().indexOf("map:") !== 0) {
            finalTag = "Map: " + (tag || "General");
          }
        }

        itemsToUpload.push({
          name: name,
          tag: finalTag,
          brand: finalTag,
          image: image,
          size: size,
          file: file,
          meta: finalTag
        });
      }

      if(itemsToUpload.length === 0) return;

      btn.disabled = true;
      btn.innerText = "Uploading Bulk...";
      status.className = "status-msg";
      status.style.color = "var(--muted)";
      status.innerText = `Uploading ${itemsToUpload.length} items...`;

      try {
        for(let i=0; i < itemsToUpload.length; i++) {
          let carData = itemsToUpload[i];
          carData.id = "x0_car_" + Date.now() + "_" + i;
          
          const isMap = isMapItem(carData);
          const targetRef = ref(db, isMap ? '/v2_cars_dev' : '/v2_cars');
          
          await push(targetRef, carData);
        }
        status.className = "status-msg ok";
        status.innerText = `✅ Success! ${itemsToUpload.length} items added.`;
        
        setTimeout(() => {
          bulkContainer.innerHTML = "";
          bulkFormCounter = 0;
          addBulkCarForm();
          status.innerText = "";
          btn.disabled = false;
          btn.innerText = "Upload All Items";
        }, 2000);
      } catch(error) {
        status.className = "status-msg error";
        status.innerText = "Upload failed: " + error.message;
        btn.disabled = false;
        btn.innerText = "Upload All Items";
      }
    });
  </script>
</body>
</html>
